[package]
name = "dojo_common"
version = "0.0.0"
edition = "2018"
authors = []
build = "../build-dojo.rs"
workspace = "../../"

[dependencies]
bimap = "0.6.3"
bitflags = "2.13.2"
clap = { version = "2.33.0", features = [ "suggestions", "color", "unstable" ] }
glob = "0.3.4"
handlebars = "6.4.4"
indicatif = "0.18.6"
jsonschema = { version = "0.60.2", default-features = false }
libc = "0.2.191"
log = "0.4"
petgraph = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.0.0"
tempfile = "3.27.0"
termcolor = "1.4.1"
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dependencies.dojo_core]
path = "../core"

[dependencies.dojo_api_client]
path = "../builder-api-client"

[features]
default = []
functional = []
