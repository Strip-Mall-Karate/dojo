[package]
name = "dojo_common"
version = "0.0.0"
edition = "2018"
authors = []
build = "../build-dojo.rs"
workspace = "../../"

[dependencies]
bimap = "*"
bitflags = "*"
clap = { version = "*", features = [ "suggestions", "color", "unstable" ] }
glob = "*"
# The handlebars crate has a few issues that require us to lock at 0.28.3
# until further notice.
#
# - 0.30.0 bumps to a version of the `pest` crate that failed to build
#   on Windows, which Dojo no longer builds for.
# - 0.29.0 makes a change to array processing that is incompatible
#   with our templating syntax; we use "foo[0]", but it now requires
#   "foo.[0]"
#   See https://github.com/sunng87/handlebars-rust/commit/707f05442ef6f441a1cfc6b13ac180b78cb296db
handlebars = { version = "= 0.28.3", default-features = false }
# Pending upgrade activities
hyper = "0.10"
json = "*"
lazy_static = "*"
libc = "*"
log = "0.4"
pbr = "*"
petgraph = "*"
regex = "*"
serde = "*"
serde_derive = "*"
serde_json = "*"
serde-transcode = "*"
serde_yaml = "*"
tempfile = "*"
retry = "*"
termcolor = "*"
time = "*"
toml = { version = "*", default-features = false }
uuid = { version = "*", features = ["v4"] }
valico = "*"

[dependencies.dojo_core]
path = "../core"

[dependencies.dojo_api_client]
path = "../builder-api-client"

[features]
default = []
functional = []
