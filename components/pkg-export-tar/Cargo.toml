[package]
name = "dojo_pkg_export_tar"
version = "0.0.0"
edition = "2018"
authors = []
workspace = "../../"

[lib]
name = "dojo_pkg_export_tar"

[[bin]]
name = "doj-pkg-export-tar"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["string"] }
env_logger = "0.6.1"
doj = { path = "../doj" }
dojo_common = { path = "../common" }
dojo_core = { path = "../core" }
lazy_static = "1.3.0"
log = "0.4"
mktemp = "0.4.0"
serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
tempfile = "3.27.0"
tar = "0.4.46"
flate2 = "1.0.7"
