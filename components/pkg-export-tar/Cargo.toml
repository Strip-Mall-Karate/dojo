[package]
name = "dojo_pkg_export_tar"
version = "0.0.0"
edition = "2018"
authors = []
workspace = "../../"

[lib]
name = "dojo_pkg_export_tar"

[[bin]]
name = "doj-pkg-export-tar"
path = "src/main.rs"
doc = false

[dependencies]
base64 = "*"
clap = { version = "*", features = ["suggestions", "color", "unstable"] }
env_logger = "*"
doj = { path = "../doj" }
dojo_common = { path = "../common" }
dojo_core = { path = "../core" }
# We need to lock here since v0.30.0 bumps to a version of pest that fails to build on Windows.
handlebars = { version = "0.29.1", default-features = false }
lazy_static = "*"
log = "0.4"
mktemp = "*"
serde = { version = "*", features = ["rc"] }
serde_json = "*"
url = "*"
failure = "*"
failure_derive = "*"
tempfile = "*"
tar = "*"
flate2 = "*"
