[package]
name = "dojo_pkg_export_tar"
version = "0.0.0"
edition = "2018"
authors = []
workspace = "../../"

[lib]
name = "dojo_pkg_export_tar"

[[bin]]
name = "doj-pkg-export-tar"
path = "src/main.rs"
doc = false

[dependencies]
base64 = "0.10.1"
clap = { version = "2.33.0", features = ["suggestions", "color", "unstable"] }
env_logger = "0.6.1"
doj = { path = "../doj" }
dojo_common = { path = "../common" }
dojo_core = { path = "../core" }
# We need to lock here since v0.30.0 bumps to a version of pest that fails to build on Windows.
handlebars = { version = "0.29.1", default-features = false }
lazy_static = "1.3.0"
log = "0.4"
mktemp = "0.4.0"
serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.154"
url = "1.7.2"
failure = "0.1.5"
failure_derive = "0.1.5"
tempfile = "3.27.0"
tar = "0.4.46"
flate2 = "1.0.7"
