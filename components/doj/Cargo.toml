[package]
name = "doj"
version = "0.0.0"
edition = "2018"
authors = []
build = "../build-dojo.rs"
workspace = "../../"

[[bin]]
name = "doj"
doc = false

[dependencies]
base64 = "0.10.1"
dirs = "1.0.5"
env_logger = "0.6.1"
dojo-sup-client = { path = "../sup-client" }
dojo-sup-protocol = { path = "../sup-protocol", default-features = false }
# We need to lock here since v0.30.0 bumps to a version of pest that fails to build on Windows.
handlebars = { version = "0.29.1", default-features = false }
lazy_static = "1.3.0"
libc = "0.2.191"
log = "0.4"
pbr = "1.0.1"
protobuf = "1.5.1"
retry = "0.4.0"
serde = "1.0.229"
serde_json = "1.0.154"
serde_derive = "1.0.229"
tabwriter = "1.1.0"
termcolor = "1.0.4"
toml = "1.1.8"
url = "1.7.2"
walkdir = "2.2.7"
tar = "0.4.46"
flate2 = "1.0.7"
chrono = "0.4.6"

[dependencies.clap]
version = "4.6.7"
features = ["env", "string"]

[dependencies.clap_complete]
version = "4.6.11"

[dependencies.dojo_core]
path = "../core"

[dependencies.dojo_common]
path = "../common"

[dependencies.dojo_api_client]
path = "../builder-api-client"

[dependencies.dojo_http_client]
path = "../http-client"

[dependencies.uuid]
version = "0.7.4"
features = ["v4"]

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
functional = []
