[package]
name = "dojo_sup"
version = "0.0.0"
edition = "2018"
authors = []
build = "./build.rs"
workspace = "../../"

[lib]
name = "dojo_sup"

[[bin]]
name = "doj-sup"
path = "src/main.rs"
doc = false

[[bin]]
name = "subscriber"
path = "src/subscriber.rs"
doc = false

[dependencies]
actix = "0.7.9"
bytes = "0.4.12"
# This is temporary, until this is merged to the mainline
nitox = { git = "https://github.com/YellowInnovation/nitox", branch="feature/nats-server" }
actix-web = { version = "0.7.19", default-features = false, features = [ "rust-tls" ] }
byteorder = "1.3.1"
clap = { version = "2.33.0", features = [ "suggestions", "color", "unstable" ] }
cpu-time = "0.1.0"
env_logger = "0.6.1"
futures = "0.1.26"
glob = "0.3.0"
doj = { path = "../doj" }
dojo_butterfly = { path = "../butterfly", default-features = false }
dojo_common = { path = "../common" }
dojo_core = { path = "../core" }
dojo_api_client = { path = "../builder-api-client" }
dojo-launcher-client = { path = "../launcher-client" }
dojo-sup-protocol = { path = "../sup-protocol", default-features = false }
lazy_static = "1.3.0"
libc = "0.2.191"
log = "0.4"
notify = "4.0.10"
num_cpus = "1.10.0"
prometheus = "0.5.0"
prost = "0.5.0"
protobuf = { version = "1.5.1", features = ["bytes"] }
rand = "0.6.5"
regex = "0.2.11"
rustls = "0.14.0"
serde = { version = "1.0.229", features = ["rc"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde_yaml = "0.8.8"
serde-transcode = "1.1.0"
state = "0.4.1"
tempfile = "3.27.0"
termcolor = "1.0.4"
time = "0.1.42"
toml = "1.1.8"
tokio = "0.1.18"
tokio-core = "0.1.17"
tokio-codec = "0.1.1"
url = "1.7.2"
valico = "3.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.3.0"

[target.'cfg(target_family = "unix")'.dependencies]
proc_self = "0.1.0" # pinning this explicitly because newer versions switched to a different crate that doesn't support stable rust
jemallocator = "0.1.9"
jemalloc-ctl = "0.2.0"

[dev-dependencies]
json = "0.11.13"

[dev-dependencies.dojo_core]
path = "../core"

[features]
default = []
apidocs = []
ignore_inconsistent_tests = []
ignore_integration_tests = []
