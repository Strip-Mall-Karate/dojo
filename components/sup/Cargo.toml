[package]
name = "dojo_sup"
version = "0.0.0"
edition = "2018"
authors = []
build = "./build.rs"
workspace = "../../"

[lib]
name = "dojo_sup"

[[bin]]
name = "doj-sup"
path = "src/main.rs"
doc = false

[[bin]]
name = "subscriber"
path = "src/subscriber.rs"
doc = false

[dependencies]
actix = "*"
bytes = "*"
# This is temporary, until this is merged to the mainline
nitox = { git = "https://github.com/YellowInnovation/nitox", branch="feature/nats-server" }
actix-web = { version = "*", default-features = false, features = [ "rust-tls" ] }
byteorder = "*"
clap = { version = "*", features = [ "suggestions", "color", "unstable" ] }
cpu-time = "*"
env_logger = "*"
futures = "*"
glob = "*"
doj = { path = "../doj" }
dojo_butterfly = { path = "../butterfly", default-features = false }
dojo_common = { path = "../common" }
dojo_core = { path = "../core" }
dojo_api_client = { path = "../builder-api-client" }
dojo-launcher-client = { path = "../launcher-client" }
dojo-sup-protocol = { path = "../sup-protocol", default-features = false }
lazy_static = "*"
libc = "*"
log = "0.4"
notify = "*"
num_cpus = "*"
prometheus = "*"
prost = "*"
protobuf = { version = "1.5.1", features = ["bytes"] }
rand = "*"
regex = "*"
rustls = "*"
serde = { version = "*", features = ["rc"] }
serde_derive = "*"
serde_json = "*"
serde_yaml = "*"
serde-transcode = "*"
state = "*"
tempfile = "*"
termcolor = "*"
time = "*"
toml = { version = "*", default-features = false }
tokio = "*"
tokio-core = "*"
tokio-codec = "*"
url = "*"
valico = "*"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "*"

[target.'cfg(target_family = "unix")'.dependencies]
proc_self = "0.1.0" # pinning this explicitly because newer versions switched to a different crate that doesn't support stable rust
jemallocator = "*"
jemalloc-ctl = "*"

[dev-dependencies]
# Pending upgrade activities
hyper = "0.10"
json = "*"

[dev-dependencies.dojo_core]
path = "../core"

[features]
default = []
apidocs = []
ignore_inconsistent_tests = []
ignore_integration_tests = []
