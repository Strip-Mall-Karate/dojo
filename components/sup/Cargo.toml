[package]
name = "dojo_sup"
version = "0.0.0"
edition = "2018"
authors = []
build = "./build.rs"
workspace = "../../"

[lib]
name = "dojo_sup"

[[bin]]
name = "doj-sup"
path = "src/main.rs"
doc = false

[[bin]]
name = "subscriber"
path = "src/subscriber.rs"
doc = false

[dependencies]
async-nats = "0.51.0"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["env", "string"] }
cpu-time = "0.1.0"
env_logger = "0.6.1"
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
  "std",
] }
glob = "0.3.0"
doj = { path = "../doj" }
dojo_butterfly = { path = "../butterfly", default-features = false }
dojo_common = { path = "../common" }
dojo_core = { path = "../core" }
dojo_api_client = { path = "../builder-api-client" }
dojo-launcher-client = { path = "../launcher-client" }
dojo-sup-protocol = { path = "../sup-protocol", default-features = false }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
lazy_static = "1.3.0"
libc = "0.2.191"
log = "0.4"
notify = "4.0.10"
num_cpus = "1.10.0"
prometheus = "0.14.0"
prost = "0.14.4"
protobuf = { version = "1.5.1", features = ["bytes"] }
rand = "0.6.5"
regex = "0.2.11"
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
serde = { version = "1.0.229", features = ["rc"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde_yaml = "0.8.8"
serde-transcode = "1.1.0"
state = "0.4.1"
tempfile = "3.27.0"
termcolor = "1.0.4"
time = "0.1.42"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }
toml = "1.1.8"
url = "1.7.2"
valico = "3.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.3.0"

[target.'cfg(target_family = "unix")'.dependencies]
jemallocator = "0.1.9"
jemalloc-ctl = "0.2.0"

[dev-dependencies]
dojo-sup-client = { path = "../sup-client" }
json = "0.11.13"
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies.dojo_core]
path = "../core"

[features]
default = []
apidocs = []
ignore_inconsistent_tests = []
ignore_integration_tests = []
