[package]
name = "dojo_butterfly"
version = "0.1.0"
edition = "2018"
authors = []
build = "build.rs"
workspace = "../../"

[[bin]]
name = "butterfly"
path = "src/main.rs"
doc = false

[dependencies]
bytes = "1.12.1"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
dojo_core = { path = "../core" }
dojo_common = { path = "../common" }
jiff = "0.2.38"
log = "0.4"
prometheus = "0.14.0"
prost = "0.14.4"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["rc"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "time"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
dojo_butterfly_test = { path = "../butterfly-test" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[build-dependencies]
prost-build = "0.14.4"

[features]
default = ["protocols"]
protocols = []
ignore_inconsistent_tests = []
