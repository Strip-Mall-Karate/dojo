[package]
name = "dojo_butterfly"
version = "0.1.0"
edition = "2018"
authors = []
build = "build.rs"
workspace = "../../"

[[bin]]
name = "butterfly"
path = "src/main.rs"
doc = false

[dependencies]
byteorder = "1.3.1"
env_logger = "0.6.1"
dojo_core = { path = "../core" }
dojo_common = { path = "../common" }
log = "0.4"
lazy_static = "1.3.0"
prometheus = "0.5.0"
prost = "0.14.4"
rand = "0.6.5"
serde = { version = "1.0.229", features = ["rc"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
tempfile = "3.27.0"
time = "0.1.42"
threadpool = "1.7.1"
toml = "1.1.8"
uuid = { version = "0.7.4", features = ["v4"] }
zmq = { git = "https://github.com/erickt/rust-zmq", branch = "release/v0.8" }

[dev-dependencies]
dojo_butterfly_test = { path = "../butterfly-test" }
mktemp = "0.4.0"

[build-dependencies]
prost-build = "0.14.4"

[features]
default = ["protocols"]
protocols = []
ignore_inconsistent_tests = []
