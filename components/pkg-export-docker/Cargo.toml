[package]
name = "dojo_pkg_export_docker"
version = "0.0.0"
edition = "2018"
authors = []
build = "build.rs"
workspace = "../../"

[lib]
name = "dojo_pkg_export_docker"

[[bin]]
name = "doj-pkg-export-docker"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
# The SDK's current HTTPS client only: its default "rustls" feature is the legacy hyper 0.14 one.
aws-sdk-ecr = { version = "1.136.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["string"] }
chrono = "0.4.6"
env_logger = "0.6.1"
doj = { path = "../doj" }
dojo_common = { path = "../common" }
dojo_core = { path = "../core" }
lazy_static = "1.3.0"
log = "0.4"
serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
termcolor = "1.0.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
url = "2.5.8"

[features]
default = []
functional = []
