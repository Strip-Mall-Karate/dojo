[package]
name = "dojo_http_client"
version = "0.0.0"
edition = "2024"
authors = []
workspace = "../../"

[dependencies]
dojo_core = { path = "../core" }
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
webpki-roots = "1.0.11"
