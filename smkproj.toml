Name = "dojo"
Description = "Dojo: signed packages, a Supervisor, and the Launcher as PID 1, growing into an operating system whose machines form a ring"
MasterBranch = "main"
BaseDir = "."
Domain = ""
UnityProject = ""
Namespace = ""
Owner = "smk"
TfStateStorageAccount = ""
SsmPrefix = ""
BaseDomain = ""
# The dev shell only: the tree keeps its own Makefile (which includes smk's checks), build scripts and VM
# tooling under support/.
Features = ["nixshell"]
BootstrapComplete = true
BootstrapOnly = ["/Cargo\\.toml$", "/src/main\\.rs$"]
# Patch-note labels are for games' release notes; Dojo has none.
Exclusions = ["/patch-labels\\.json$"]
Languages = ["Rust"]
[Ci]
Provider = ""
[Ci.Settings]
[Issue]
Provider = "workq"
# One project for every repository's work items, as the other smk repositories declare it.
Project = "SMK"
Label = "dojo"
Workspace = "smk"
[Format]
Exclude = [
  # Rust is formatted and tested in the builder VM (support/vm/builder fmt, test, verify) with the tree's
  # nightly rustfmt. smk lint cannot check it yet: the workspace builds on this Mac, but clippy finds some
  # 1,500 problems in the inherited code. It joins when those are worked off (SMK-423).
  "**/*.rs", "vendor/**", "components/plan/vendor/**",
  # Languages smk has no formatter for.
  "**/*.fnl", "**/*.proto", "**/*.bats",
  # Test fixtures and package metadata: data, much of it exact bytes a test compares.
  "components/*/tests/**", "components/plan-build/test/**", "test/fixtures/**",
  "components/doj/mac/**", "components/doj/static/**", "components/rootless_studio/default/**",
  "components/pkg-export-docker/defaults/**", "components/butterfly/bin/**", "components/sup/doc/**",
  # Code on its way out, which smk checks would only churn: plan-build is the bash builder components/plan
  # replaces; the component plans' bash is being ported to Fennel; the old studios, and the support/ci, linux
  # and mac setup scripts and the docs and Docker tests for that build, belong to the build this tree no longer
  # uses. Each goes, or joins the checks, under SMK-421.
  "components/plan-build/**", "components/*/dojo/**", "components/studio/**", "components/rootless_studio/**",
  "support/ci/**", "support/linux/**", "support/mac/**", "BUILDING.md", "VERIFICATION_TESTING.md", "test/integration/**",
  # Single files no formatter owns.
  "rust-toolchain", "components/plan/rust-toolchain", "VERSION", "Vagrantfile",
  "support/vm/expected-failures", "support/vm/applets", "tools/bldr_toml_create/**",
]
[License]
Kind = "Apache-2.0"
Holder = "Strip Mall Karate Company"
Year = 2026
